name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# TP9 (hallazgo de CodeQL "Workflow does not contain permissions"): por defecto cada job
# sólo puede LEER el repo. Los dos builds piden además packages: write en su propio bloque.
permissions:
  contents: read

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:          # TP6: sólo este job puede publicar paquetes (mínimo privilegio)
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # ---- TP5: tests + coverage + umbral, usando la etapa "test" del Dockerfile ----
      - name: Construir la etapa de tests del backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: test        # se detiene en la etapa de tests, no llega a la final
          load: true          # deja la imagen en el Docker local para poder correrla
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr tests del backend con coverage y umbral
        run: docker run --rm -v "${{ github.workspace }}/backend-coverage:/out" backend-test:ci

      - name: Resumen del coverage del backend
        if: ${{ !cancelled() }}
        run: |
          test -f backend-coverage/summary.md
          cat backend-coverage/summary.md >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage del backend
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend
          path: backend-coverage

      # ---- TP6: publicar la imagen, y sólo la que pasó ----
      # Estos dos pasos van ÚLTIMOS a propósito: si los tests de arriba fallan, el job
      # muere antes y nunca se llega acá. La condición "si pasaron los tests" es el orden.
      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/santiclark02/ingsoft3-tp01-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:          # TP6: sólo este job puede publicar paquetes (mínimo privilegio)
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # ---- TP5: tests + coverage + umbral, usando la etapa "test" del Dockerfile ----
      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr tests del frontend con coverage y umbral
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/frontend-coverage:/salida" frontend-test:ci

      - name: Resumen del coverage del frontend
        if: ${{ !cancelled() }}
        run: |
          F=frontend-coverage/reporte/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisar el include'); process.exit(1); }
            const f = (m) => '| ' + m + ' | ' + t[m].pct + '% |';
            console.log('### Coverage del frontend');
            console.log('| métrica | % |'); console.log('|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage del frontend
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: frontend-coverage

      # ---- TP6: publicar la imagen, y sólo la que pasó ----
      # Estos dos pasos van ÚLTIMOS a propósito: si los tests de arriba fallan, el job
      # muere antes y nunca se llega acá. La condición "si pasaron los tests" es el orden.
      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/santiclark02/ingsoft3-tp01-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ================= TP6: Continuous Delivery =================
  # Plan C de la cátedra (§3.6): los entornos corren en un runner self-hosted (mi máquina)
  # como dos proyectos de Docker Compose separados. El deploy lo dispara SIEMPRE el pipeline.

  deploy-qa:
    runs-on: self-hosted
    needs: [build-backend, build-frontend]   # sin CI verde no hay deploy
    if: github.ref == 'refs/heads/main'      # los PRs verifican; sólo main despliega
    environment: qa                          # sus secrets + historial de deploys
    concurrency: { group: deploy-qa, cancel-in-progress: false }
    env:
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}   # secrets del environment qa
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      # checkout baja EL commit de esta corrida (github.sha), no la punta de main:
      # se despliega lo mismo que se verificó.
      - uses: actions/checkout@v4

      - name: Desplegar QA (baja la imagen verificada y la ejecuta)
        shell: cmd
        run: |
          echo Imagenes a desplegar en QA: ghcr.io/santiclark02/ingsoft3-tp01-backend:sha-%GITHUB_SHA% y ghcr.io/santiclark02/ingsoft3-tp01-frontend:sha-%GITHUB_SHA%
          docker compose -f compose.qa.yml pull || exit /b 1
          docker compose -f compose.qa.yml up -d || exit /b 1
          docker compose -f compose.qa.yml images

      - name: Smoke test QA (con reintentos)
        shell: powershell
        env:
          URL_API: http://localhost:8081
          URL_FRONT: http://localhost:3001
        run: |
          # Verifica 4 cosas: la api vive (/health), la base responde (/activities lee de MySQL),
          # el front se sirve, y /health dice que corre ESTE commit (no una versión vieja).
          $ok = $false
          for ($i = 1; $i -le 30; $i++) {
            try {
              $h = Invoke-RestMethod -Uri "$env:URL_API/health" -TimeoutSec 10
              Invoke-WebRequest -UseBasicParsing -Uri "$env:URL_API/activities" -TimeoutSec 10 | Out-Null
              Invoke-WebRequest -UseBasicParsing -Uri "$env:URL_FRONT/" -TimeoutSec 10 | Out-Null
              if ($h.commit -ne $env:GITHUB_SHA) { throw "corre el commit $($h.commit), se esperaba $env:GITHUB_SHA" }
              Write-Host "OK QA responde (API + BD + front) y corre el commit $($h.commit)"
              $ok = $true
              break
            } catch {
              Write-Host "Intento $i/30: $($_.Exception.Message)"
              Start-Sleep -Seconds 10
            }
          }
          if (-not $ok) { Write-Host "QA no respondio a tiempo"; exit 1 }

  # ================= TP7: las pruebas como gate de promoción =================
  # deploy-qa -> integracion (API de QA + su MySQL, sin navegador) -> e2e (navegador real
  # contra el front de QA) -> aprobación -> deploy-prod. Si alguna suite falla, PROD ni se pide.

  integracion:
    runs-on: self-hosted                     # QA vive en esta máquina (plan C): las pruebas corren acá
    needs: deploy-qa                         # QA ya ejecuta la imagen de ESTA corrida
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias (sin navegador)
        working-directory: ./frontend
        shell: cmd
        run: npm ci

      - name: Integracion contra la API de QA
        working-directory: ./frontend
        shell: cmd
        env:
          API_BASE_URL: http://localhost:8081   # la API de QA (no el front)
        run: npx playwright test e2e/api.spec.js

      - name: Resumen de integracion
        if: ${{ !cancelled() }}
        working-directory: ./frontend
        shell: cmd
        run: node -e "const s=require('./playwright-resultados.json').stats; console.log('### Integracion contra la API de QA\n| passed | failed | flaky | skipped |\n|---|---|---|---|\n| '+s.expected+' | '+s.unexpected+' | '+s.flaky+' | '+s.skipped+' |')" >> "%GITHUB_STEP_SUMMARY%"

      - name: Publicar reporte
        if: ${{ !cancelled() }}            # el reporte importa MÁS cuando falla
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-integracion               # nombre distinto por suite
          path: frontend/playwright-report
          retention-days: 7

  e2e:
    runs-on: self-hosted                     # QA vive en esta máquina (plan C): las pruebas corren acá
    needs: integracion                       # si la API está rota, no gastamos un navegador
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Dos pasos separados a propósito: en cmd, npm/npx son archivos .cmd, y llamar uno
      # desde un script sin CALL termina el script ahí: la segunda línea nunca corría.
      - name: Instalar dependencias
        working-directory: ./frontend
        shell: cmd
        run: npm ci

      - name: Instalar el navegador (Chromium)
        working-directory: ./frontend
        shell: cmd
        run: npx playwright install chromium

      - name: E2E contra el front de QA
        working-directory: ./frontend
        shell: cmd
        env:
          E2E_BASE_URL: http://localhost:3001   # el front de QA
        run: npx playwright test e2e/actividades.spec.js

      - name: Resumen de e2e
        if: ${{ !cancelled() }}
        working-directory: ./frontend
        shell: cmd
        run: node -e "const s=require('./playwright-resultados.json').stats; console.log('### E2E contra el front de QA\n| passed | failed | flaky | skipped |\n|---|---|---|---|\n| '+s.expected+' | '+s.unexpected+' | '+s.flaky+' | '+s.skipped+' |')" >> "%GITHUB_STEP_SUMMARY%"

      - name: Publicar reporte
        if: ${{ !cancelled() }}            # el reporte importa MÁS cuando falla
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-e2e               # nombre distinto por suite
          path: frontend/playwright-report
          retention-days: 7

  deploy-prod:
    runs-on: self-hosted
    needs: e2e                               # EL gate: sin integración + e2e en verde, ni se pide aprobación
    environment: production                  # aca el workflow SE PAUSA hasta que el reviewer apruebe
    concurrency: { group: deploy-prod, cancel-in-progress: false }
    env:
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}   # secrets del environment production: sin aprobación no los lee nadie
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}     # TP9: sólo PROD manda datos a Sentry
    steps:
      - uses: actions/checkout@v4            # el commit aprobado, no lo último de main

      - name: Desplegar PROD (baja la imagen verificada y la ejecuta)
        shell: cmd
        run: |
          echo Imagenes a desplegar en PROD: ghcr.io/santiclark02/ingsoft3-tp01-backend:sha-%GITHUB_SHA% y ghcr.io/santiclark02/ingsoft3-tp01-frontend:sha-%GITHUB_SHA%
          docker compose -f compose.prod.yml pull || exit /b 1
          docker compose -f compose.prod.yml up -d || exit /b 1
          docker compose -f compose.prod.yml images

      - name: Smoke test PROD (con reintentos)
        shell: powershell
        env:
          URL_API: http://localhost:8082
          URL_FRONT: http://localhost:3002
        run: |
          # Verifica 4 cosas: la api vive (/health), la base responde (/activities lee de MySQL),
          # el front se sirve, y /health dice que corre ESTE commit (no una versión vieja).
          $ok = $false
          for ($i = 1; $i -le 30; $i++) {
            try {
              $h = Invoke-RestMethod -Uri "$env:URL_API/health" -TimeoutSec 10
              Invoke-WebRequest -UseBasicParsing -Uri "$env:URL_API/activities" -TimeoutSec 10 | Out-Null
              Invoke-WebRequest -UseBasicParsing -Uri "$env:URL_FRONT/" -TimeoutSec 10 | Out-Null
              if ($h.commit -ne $env:GITHUB_SHA) { throw "corre el commit $($h.commit), se esperaba $env:GITHUB_SHA" }
              Write-Host "OK PROD responde (API + BD + front) y corre el commit $($h.commit)"
              $ok = $true
              break
            } catch {
              Write-Host "Intento $i/30: $($_.Exception.Message)"
              Start-Sleep -Seconds 10
            }
          }
          if (-not $ok) { Write-Host "PROD no respondio a tiempo"; exit 1 }
