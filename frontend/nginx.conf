server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo real
    # devuelve index.html para que React Router la resuelva.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy hacia el backend.
    # La barra final en proxy_pass hace que /api/activities
    # llegue al backend como /activities.
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}